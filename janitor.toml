# Janitor CLI version used by the generated GitHub Actions workflow.
version = "latest"

[review]
# Append per-run model token usage and estimated cost to the main review comment.
track_spend = true

# Run a review when at least one changed path matches one of these glob patterns.
tracked_paths = ["**"]

# Release pull requests only bump versions and the changelog.
excluded_branches = ["brel/release/**"]

# Report a "Janitor" check run that passes only when review confidence reaches 4/5.
[review.merge_check]
min_confidence = 4
