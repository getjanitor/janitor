name: Janitor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Secrets and write tokens are intentionally unavailable to pull requests from forks.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Janitor
        run: pnpm run build
      - name: Review pull request
        run: node dist/index.mjs review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JANITOR_MODEL: ${{ secrets.JANITOR_MODEL }}
          JANITOR_PROVIDER: ${{ secrets.JANITOR_PROVIDER }}
          JANITOR_PROVIDER_KEY: ${{ secrets.JANITOR_PROVIDER_KEY }}
          JANITOR_VERBOSE: ${{ vars.JANITOR_VERBOSE }}
